openapi: 3.1.0
info:
  title: ImmoService API
  version: 1.0.0
  description: API de gestion d'annonces immobilières.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - USER
            - AGENT
            - ADMIN
      required:
        - id
        - name
        - email
        - role
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
                required:
                  - field
                  - message
          required:
            - code
            - message
      required:
        - error
    RegisterBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Jean Dupont
        email:
          type: string
          maxLength: 254
          format: email
          example: jean@exemple.fr
        password:
          type: string
          minLength: 8
          maxLength: 128
          example: motdepasse123
      required:
        - name
        - email
        - password
    TokenResponse:
      type: object
      properties:
        token:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: string
          example: 1h
      required:
        - token
        - tokenType
        - expiresIn
    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - email
        - password
  parameters: {}
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Créer un compte (rôle USER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email déjà utilisé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      tags:
        - Auth
      summary: S'authentifier et obtenir un JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Jeton émis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/me:
    get:
      tags:
        - Auth
      summary: Profil de l'utilisateur authentifié
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Jeton absent, invalide ou expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
webhooks: {}
