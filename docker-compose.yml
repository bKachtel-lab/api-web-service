version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: immo_service_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-immodb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_test:
    image: postgres:16-alpine
    container_name: immo_postgres_test
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:?POSTGRES_TEST_USER manquant}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?POSTGRES_TEST_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_TEST_DB:?POSTGRES_TEST_DB manquant}
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  postgres_test_data: